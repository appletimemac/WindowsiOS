name: WindowsiOS
options:
  bundleIdPrefix: com.RRGSyndicate
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"

settings:
  base:
    DEVELOPMENT_TEAM: 6SD7AF9K8B
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  WindowsiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
          - "Resources/**"
      - path: Sources/Resources/henge-jit.js
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Windows 11
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        NSMicrophoneUsageDescription: "Windows 11 and Antigravity use your iPhone Duo microphone for live voice input and audio capture."
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    entitlements:
      path: WindowsiOS.entitlements
      properties:
        get-task-allow: true
        com.apple.developer.kernel.extended-virtual-addressing: true
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.RRGSyndicate.WindowsiOS
        PRODUCT_NAME: WindowsiOS
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/Sources/Native/WindowsiOS-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../core
          - $(PROJECT_DIR)/../host
          - $(PROJECT_DIR)/../devices
          - $(PROJECT_DIR)/deps/include
          - $(PROJECT_DIR)/Sources/Native
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../build/ios
          - $(PROJECT_DIR)/deps/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - -lwinvm
          - -lslirp
          - -lglib-2.0
          - -lintl
          - -lpcre2-8
          - -lffi
          - -lresolv
          - -liconv
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: SafariServices.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework

  WindowsiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/Posture.swift
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.RRGSyndicate.WindowsiOSTests

schemes:
  WindowsiOS:
    build:
      targets:
        WindowsiOS: all
    run:
      config: Debug
    archive:
      config: Release
  WindowsiOSTests:
    build:
      targets:
        WindowsiOSTests: [test]
    test:
      config: Debug
      targets:
        - WindowsiOSTests
